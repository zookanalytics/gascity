description = """
Graph-first worktree lifecycle.

This is the built-in v2 workflow prototype for Gas City. It models work as an
explicit DAG with:

- a durable `body` scope bead
- explicit worktree setup and teardown
- first-class step beads that can be routed independently
- continuation metadata for same-session execution

Use this as the opt-in replacement for hierarchy-first single-session formulas.
"""
formula = "mol-scoped-work"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.base_branch]
description = "Base branch to branch from"
default = "main"

[vars.setup_command]
description = "Optional setup command (install deps, bootstrap tools)"
default = ""

[vars.typecheck_command]
description = "Optional typecheck command"
default = ""

[vars.lint_command]
description = "Optional lint command"
default = ""

[vars.build_command]
description = "Optional build command"
default = ""

[vars.test_command]
description = "Optional test command"
default = ""

[[steps]]
id = "load-context"
title = "Load context and inspect the assignment"
description = """
Prime the workspace, inspect the assigned work, and understand the current bead
metadata before doing anything destructive.

```bash
gc prime
gc bd prime
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORK_BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
printf '%s' "$WORK_BEAD_JSON" | jq '.[0]'
printf '%s' "$WORK_BEAD_JSON" | jq '.[0].metadata'
gc mail inbox
```

Then verify the work bead is not already in flight under someone else, and
FAIL CLOSED if you cannot prove that it isn't. A work bead can be reachable
from two dispatch surfaces at once — this workflow and a direct route left on
the bead — and both firing puts two sessions on one branch, where
`workspace-setup` destroys the live one's uncommitted work.

```bash
WORK_STATUS=$(printf '%s' "$WORK_BEAD_JSON" | jq -r '.[0].status // empty')
WORK_OWNER=$(printf '%s' "$WORK_BEAD_JSON" | jq -r '.[0].assignee // empty')
if [ -z "$WORK_STATUS" ]; then
  # An unreadable bead is not proof of safety. Treat it as blocked.
  WORK_STATUS=unknown
  WORK_OWNER="${WORK_OWNER:-unreadable}"
fi
OWNER_LIVE=0
case "$WORK_OWNER" in
  ""|"$GC_SESSION_NAME"|"$GC_SESSION_ID"|"$GC_AGENT"|"$GC_ALIAS") ;;   # unowned, or owned by you
  *)
    if [ "$WORK_STATUS" = "in_progress" ] || [ "$WORK_STATUS" = "unknown" ]; then
      # An assignee can be any of the three forms a claim writes: the session
      # name (what `gc bd update --claim` sets), the session id, or the agent
      # address. Match all of them — a session record exposes them as
      # .session_name, .id and .alias respectively, and has no .name field.
      OWNER_LIVE=$(gc session list --state all --json 2>/dev/null \
        | jq -r --arg o "$WORK_OWNER" \
            '[.sessions[]? | select(((.alias // "") == $o) or ((.alias // "") | endswith($o)) or ((.session_name // "") == $o) or ((.id // "") == $o))] | length' 2>/dev/null)
      # No answer means you could not disprove a live owner — assume one.
      [ -z "$OWNER_LIVE" ] && OWNER_LIVE=1
    fi ;;
esac
if [ "$OWNER_LIVE" != "0" ]; then
  gc bd update "$WORK_BEAD_ID" --append-notes "Duplicate dispatch refused: $GC_SESSION_NAME found $WORK_BEAD_ID already $WORK_STATUS under live $WORK_OWNER (convoy {{convoy_id}}). Held at load-context; no workspace touched."
  gc runtime drain-ack
  exit 1
fi
```

Do NOT close this step when the check trips. Closing it advances the workflow
into `workspace-setup`; leaving it open holds the workflow, which is the safe
state, and the note on the work bead is the durable record of why.

Liveness is the gate, not staleness: an idle worker between claims is
indistinguishable from an abandoned one, so only a session absent from
`gc session list --state all` is safely gone.
"""
metadata = { "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "body"
title = "Worktree body scope"
needs = ["workspace-setup", "preflight-tests", "implement", "self-review", "submit"]
description = """
Terminal latch for the main worktree body.

Normal work beads inside this scope can fail. Paired `scope-check` control
beads handle fail-fast skipping, close this bead with `gc.outcome=fail|pass`,
and allow teardown to proceed.
"""
metadata = { "gc.kind" = "scope", "gc.scope_name" = "worktree", "gc.scope_role" = "body" }

[[steps]]
id = "workspace-setup"
title = "Set up a worktree and branch"
needs = ["load-context"]
description = """
Ensure there is an isolated worktree for this work item.

```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -z "$WORKTREE" ]; then
  WORKTREE_PATH=$(pwd)/worktrees/"$WORK_BEAD_ID"
  git worktree add "$WORKTREE_PATH" --detach origin/{{base_branch}}
  gc bd update "$WORK_BEAD_ID" --set-metadata work_dir="$WORKTREE_PATH"
  WORKTREE="$WORKTREE_PATH"
fi
cd "$WORKTREE"
{{setup_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "setup", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "preflight-tests"
title = "Run preflight checks on the base branch"
needs = ["workspace-setup"]
description = """
Run the configured checks before implementation.

```bash
{{typecheck_command}}
{{lint_command}}
{{test_command}}
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "implement"
title = "Implement the requested change"
needs = ["preflight-tests"]
description = """
Make the code changes for convoy `{{convoy_id}}` in the worktree. Commit focused changes
as needed and keep the branch scoped to this work.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "self-review"
title = "Review the diff and run verification"
needs = ["implement"]
description = """
Inspect the change and run verification commands.

```bash
git diff origin/{{base_branch}}...HEAD
{{typecheck_command}}
{{lint_command}}
{{build_command}}
{{test_command}}
git status
```
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "submit"
title = "Finalize the work item"
needs = ["self-review"]
description = """
Perform the city-specific finalization for this work item. Examples:

- push the branch and hand off to a reviewer
- close the original work bead
- update metadata for downstream systems

This is intentionally generic so cities can opt into the graph contract
without inheriting Gastown's exact human workflow.
"""
metadata = { "gc.scope_ref" = "body", "gc.scope_role" = "member", "gc.on_fail" = "abort_scope", "gc.continuation_group" = "main", "gc.session_affinity" = "require" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"

[[steps]]
id = "cleanup-worktree"
title = "Clean up the worktree"
needs = ["body"]
description = """
Remove the temporary worktree after the body reaches terminal state.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-scoped-work requires an input convoy with exactly one tracked member" >&2
  exit 1
fi
WORKTREE=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.work_dir // empty')
if [ -n "$WORKTREE" ] && [ -d "$WORKTREE" ]; then
  # cwd is not guaranteed to be inside the repo at this step, so resolve REPO
  # off the worktree itself rather than off `pwd`.
  REPO=$(git -C "$WORKTREE" rev-parse --path-format=absolute --git-common-dir)
  if [ -z "$REPO" ]; then
    echo "cleanup: could not resolve the owning repo for $WORKTREE; leaving it registered" >&2
  elif ! git -C "$REPO" worktree remove --force "$WORKTREE"; then
    if [ -f "$WORKTREE/.git" ]; then
      rm -rf "$WORKTREE"
      git -C "$REPO" worktree prune
    else
      echo "cleanup: refusing to rm -rf $WORKTREE: not a linked worktree" >&2
    fi
  fi
fi
gc bd update "$WORK_BEAD_ID" --unset-metadata work_dir
```
"""
metadata = { "gc.kind" = "cleanup", "gc.scope_ref" = "body", "gc.scope_role" = "teardown" }

[steps.retry]
max_attempts = 3
on_exhausted = "hard_fail"
