# Notify gasworks-control-plane to rebuild the gc-runtime image when Go source
# changes.
#
# gascity provides the gc binary embedded in runtime images.
# When source code changes, images need rebuilding.
#
# Required secret: GASCITY_HOSTED_TOKEN — a token with contents:write on
# gascity/gasworks-control-plane (needed for repository_dispatch). A
# fine-grained PAT scoped to that repo, or a classic PAT with repo scope.

name: Notify Image Rebuilds

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "contrib/**"
      - ".github/workflows/notify-image-build.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    # Only the canonical repo can dispatch to gascity/gasworks-control-plane:
    # GASCITY_HOSTED_TOKEN is a contents:write credential there, which a fork
    # neither has nor should have. Unguarded, GH_TOKEN resolves to the empty
    # string on every fork and gh exits 4, so the job fails by construction
    # rather than skipping.
    if: ${{ github.repository == 'gastownhall/gascity' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger runtime image rebuild
        env:
          GH_TOKEN: ${{ secrets.GASCITY_HOSTED_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/gascity/gasworks-control-plane/dispatches \
            -f event_type=runtime-dep-updated
